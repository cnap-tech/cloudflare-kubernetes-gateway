kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
containerdConfigPatches:
  # The Docker daemon backing this Kind node uses VFS inside Kata. A nested
  # overlayfs snapshotter cannot mount there, so use containerd's native
  # snapshotter just as the k3d validation jobs do.
  - |-
    [plugins.'io.containerd.cri.v1.images']
      snapshotter = "native"
nodes:
  - role: control-plane
    extraMounts:
      - hostPath: /dev/kmsg
        containerPath: /dev/kmsg
