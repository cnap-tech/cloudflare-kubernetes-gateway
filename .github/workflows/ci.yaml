name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint & Test
    runs-on: akua-x64-ci-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Format check
        run: make fmt-check

      - name: Vet
        run: make vet

      - name: Lint
        run: make lint

      - name: Unit tests
        run: make test

  build:
    name: Docker Build
    runs-on: akua-docker-ci-v2
    needs: check
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build image
        run: make docker-build IMG=${{ env.IMG }}
        env:
          IMG: ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Push image
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag "$IMG" "$LATEST"
          docker push "$IMG"
          docker push "$LATEST"
        env:
          IMG: ghcr.io/${{ github.repository }}:${{ github.sha }}
          LATEST: ghcr.io/${{ github.repository }}:latest

  e2e:
    name: E2E Tests
    runs-on: akua-docker-ci-v2
    needs: check
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    env:
      KMSG_HELPER_IMAGE: busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Prepare guest-local kmsg device
        run: |
          docker run --rm --privileged \
            --volume /dev:/host-dev \
            "$KMSG_HELPER_IMAGE" \
            sh -c 'test -e /host-dev/kmsg || mknod /host-dev/kmsg c 1 11'

      - name: Create Kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: kind
          config: .github/kind-config.yaml
          node_image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f

      - name: Run E2E tests
        continue-on-error: true
        run: make test-e2e
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Controller logs
        if: always()
        run: kubectl logs -n cloudflare-gateway deployment/cloudflare-controller-manager || true

      - name: Upload conformance report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: conformance-report
          path: '*-report.yaml'
          if-no-files-found: ignore

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: akua-docker-ci-v2
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git fetch --force --tags

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: goreleaser/goreleaser-action@v6
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
